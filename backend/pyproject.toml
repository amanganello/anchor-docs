[project]
name = "anchor-docs-backend"
version = "0.1.0"
description = "FastAPI streaming backend for Anchor Docs"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "google-genai==2.16.0",
  "pydantic-settings>=2.7.0,<3.0",
  "uvicorn[standard]>=0.34.0,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1.0",
  "pyright>=1.1.400,<2.0",
  "pytest>=8.3.0,<10.0",
  "pytest-asyncio>=0.25.0,<2.0",
  "ruff>=0.9.0,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live: calls a real provider and consumes quota",
  "deployed: calls a deployed backend URL",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportMissingTypeStubs = false
